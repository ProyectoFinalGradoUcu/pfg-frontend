<div class="appsearch">
  <svg class="appsearch__icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
  </svg>
  <input
    type="text"
    class="appsearch__input"
    [value]="value"
    (input)="onInput($event)"
    [placeholder]="placeholder"
    [attr.aria-label]="ariaLabel ?? placeholder"
    autocomplete="off"
  />
  <button *ngIf="value" type="button" class="appsearch__clear" (click)="clear()" aria-label="Limpiar búsqueda">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
    </svg>
  </button>
</div>
