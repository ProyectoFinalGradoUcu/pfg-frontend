<div class="fdn">
  <app-select
    *ngIf="conEscala"
    class="fdn__select fdn__escala"
    [items]="escalas"
    placeholder="Todas las escalas"
    [clearable]="true"
    [ngModel]="filtro().escala ?? null"
    (ngModelChange)="actualizar({ escala: $event })"
  ></app-select>

  <ng-container *ngIf="conGradoEscalafon">
    <app-select
      class="fdn__select fdn__grado"
      [items]="grados()"
      bindLabel="denominacion"
      bindValue="id"
      placeholder="Todos los grados"
      [multiple]="true"
      [searchable]="true"
      [clearable]="true"
      [ngModel]="filtro().gradoId ?? []"
      (ngModelChange)="actualizar({ gradoId: $event })"
    ></app-select>

    <app-select
      class="fdn__select fdn__escalafon"
      [items]="escalafones()"
      bindLabel="denominacion"
      bindValue="id"
      placeholder="Todos los escalafones"
      [multiple]="true"
      [searchable]="true"
      [clearable]="true"
      [ngModel]="filtro().escalafonId ?? []"
      (ngModelChange)="actualizar({ escalafonId: $event })"
    ></app-select>
  </ng-container>

  <app-selector-rango class="fdn__rango" etiqueta="Derecha"
    [desde]="filtro().derechaDesde" [hasta]="filtro().derechaHasta"
    (rangoChange)="actualizar({ derechaDesde: $event.desde, derechaHasta: $event.hasta })"></app-selector-rango>

  <app-selector-rango class="fdn__rango" etiqueta="Numor"
    [desde]="filtro().numorDesde" [hasta]="filtro().numorHasta"
    (rangoChange)="actualizar({ numorDesde: $event.desde, numorHasta: $event.hasta })"></app-selector-rango>

  <ng-container *ngIf="conOrden">
    <app-select
      class="fdn__select fdn__orden"
      [items]="opcionesOrden"
      [ngModel]="filtro().ordenarPor ?? 'derecha'"
      (ngModelChange)="actualizar({ ordenarPor: $event })"
    ></app-select>
    <button type="button" class="fdn__dir" (click)="alternarDireccion()"
      [attr.aria-label]="filtro().direccion === 'DESC' ? 'Descendente: cambiar a ascendente' : 'Ascendente: cambiar a descendente'"
      [title]="filtro().direccion === 'DESC' ? 'Descendente' : 'Ascendente'">
      {{ filtro().direccion === 'DESC' ? '↓' : '↑' }}
    </button>
  </ng-container>

  <button type="button" class="fdn__limpiar" *ngIf="conLimpiar && hayFiltro()" (click)="limpiarTodo()">Limpiar</button>
</div>
