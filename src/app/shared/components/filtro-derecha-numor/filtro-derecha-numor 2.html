<div class="fdn">
  <select aria-label="Escala" (change)="onEscala($event)">
    <option value="" [selected]="!filtro().escala">Todas las escalas</option>
    <option *ngFor="let e of escalas" [value]="e.value" [selected]="e.value === filtro().escala">{{ e.label }}</option>
  </select>

  <select aria-label="Grado" (change)="onNumero('gradoId', $event)">
    <option value="" [selected]="filtro().gradoId == null">Todos los grados</option>
    <option *ngFor="let g of grados()" [value]="g.id" [selected]="g.id === filtro().gradoId">{{ g.denominacion }}</option>
  </select>

  <select aria-label="Escalafón" (change)="onNumero('escalafonId', $event)">
    <option value="" [selected]="filtro().escalafonId == null">Todos los escalafones</option>
    <option *ngFor="let e of escalafones()" [value]="e.id" [selected]="e.id === filtro().escalafonId">{{ e.denominacion }}</option>
  </select>

  <app-selector-rango class="fdn__rango" etiqueta="Derecha"
    [desde]="filtro().derechaDesde" [hasta]="filtro().derechaHasta"
    (rangoChange)="actualizar({ derechaDesde: $event.desde, derechaHasta: $event.hasta })"></app-selector-rango>

  <app-selector-rango class="fdn__rango" etiqueta="Numor"
    [desde]="filtro().numorDesde" [hasta]="filtro().numorHasta"
    (rangoChange)="actualizar({ numorDesde: $event.desde, numorHasta: $event.hasta })"></app-selector-rango>

  <ng-container *ngIf="conOrden">
    <select aria-label="Ordenar por" (change)="onOrdenarPor($event)">
      <option *ngFor="let o of opcionesOrden" [value]="o.value" [selected]="o.value === filtro().ordenarPor">
        Ordenar por {{ o.label | lowercase }}
      </option>
    </select>
    <button type="button" class="fdn__dir" (click)="alternarDireccion()"
      [attr.aria-label]="filtro().direccion === 'DESC' ? 'Descendente: cambiar a ascendente' : 'Ascendente: cambiar a descendente'"
      [title]="filtro().direccion === 'DESC' ? 'Descendente' : 'Ascendente'">
      {{ filtro().direccion === 'DESC' ? '↓' : '↑' }}
    </button>
  </ng-container>

  <button type="button" class="fdn__limpiar" *ngIf="conLimpiar && hayFiltro()" (click)="limpiarTodo()">Limpiar</button>
</div>
