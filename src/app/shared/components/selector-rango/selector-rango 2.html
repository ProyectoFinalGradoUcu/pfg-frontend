<div class="sr" [class.sr--abierto]="abierto()">
  <button type="button" class="sr__control" (click)="alternar()" [attr.aria-expanded]="abierto()"
    [attr.aria-label]="etiqueta + (texto() ? ': ' + texto() : '')">
    <span class="sr__valor" *ngIf="texto() as t"><span class="sr__etiqueta">{{ etiqueta }}:</span> {{ t }}</span>
    <span class="sr__placeholder" *ngIf="!texto()">{{ etiqueta }}</span>

    <span class="sr__iconos">
      <span *ngIf="texto()" role="button" tabindex="0" class="sr__quitar" (click)="limpiar($event)"
        (keydown.enter)="limpiar($event)" [attr.aria-label]="'Quitar filtro de ' + etiqueta">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </span>
      <span class="sr__flecha" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>
      </span>
    </span>
  </button>

  <div class="sr__panel" *ngIf="abierto()" role="dialog" [attr.aria-label]="'Rango de ' + etiqueta"
    (keydown.enter)="aplicar()">
    <div class="sr__campos">
      <label>
        <span>Desde</span>
        <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="—"
          [value]="borradorDesde()" (keydown)="soloDigitos($event)" (input)="onEscribir('desde', $event)" autofocus />
      </label>
      <span class="sr__guion" aria-hidden="true">–</span>
      <label>
        <span>Hasta</span>
        <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="—"
          [value]="borradorHasta()" (keydown)="soloDigitos($event)" (input)="onEscribir('hasta', $event)" />
      </label>
    </div>

    <p class="sr__error" *ngIf="invertido()" role="alert">"Desde" tiene que ser menor o igual que "hasta".</p>

    <div class="sr__acciones">
      <button type="button" class="sr__btn sr__btn--texto" (click)="limpiar()">Limpiar</button>
      <button type="button" class="sr__btn sr__btn--primario" [disabled]="invertido()" (click)="aplicar()">Aplicar</button>
    </div>
  </div>
</div>
