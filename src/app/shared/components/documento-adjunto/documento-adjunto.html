<div class="adjunto">
  <ng-container *ngIf="nombre; else sinDocumento">
    <span class="adjunto__archivo" [title]="nombre">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
      </svg>
      <span class="adjunto__nombre">{{ nombre }}</span>
      <span class="adjunto__meta" *ngIf="tamanioLegible() as t">· {{ t }}</span>
    </span>
    <span class="adjunto__acciones">
      <button
        *ngIf="puedeVer"
        type="button"
        class="adjunto__icono"
        [attr.aria-pressed]="!!visorUrl"
        [title]="visorUrl ? 'Ocultar vista previa' : 'Ver vista previa'"
        [attr.aria-label]="(visorUrl ? 'Ocultar vista previa de «' : 'Ver vista previa de «') + nombre + '»'"
        (click)="verAlternado.emit()"
      >
        <svg *ngIf="!visorUrl" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>
        <svg *ngIf="visorUrl" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
        </svg>
      </button>
      <a
        *ngIf="urlDescarga"
        class="adjunto__icono"
        [href]="urlDescarga"
        download
        title="Descargar"
        [attr.aria-label]="'Descargar «' + nombre + '»'"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
        </svg>
      </a>
      <button
        *ngIf="puedeEditar"
        type="button"
        class="adjunto__icono adjunto__icono--peligro"
        [disabled]="ocupado"
        title="Quitar"
        [attr.aria-label]="'Quitar «' + nombre + '»'"
        (click)="quitado.emit()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
        </svg>
      </button>
    </span>
  </ng-container>

  <ng-template #sinDocumento>
    <ng-container *ngIf="puedeEditar">
      <button
        type="button"
        class="adjunto__accion"
        [disabled]="!habilitado || ocupado"
        [title]="habilitado ? '' : 'Escribí el número para poder adjuntar'"
        (click)="fileInput.click()"
      >Adjuntar documento</button>
      <span class="adjunto__meta">(opcional)</span>
    </ng-container>
  </ng-template>

  <input
    #fileInput
    type="file"
    class="adjunto__file"
    [accept]="extensiones"
    (change)="onArchivoElegido($event)"
  />
</div>
<p *ngIf="error()" class="adjunto__error" role="alert">{{ error() }}</p>
<div *ngIf="nombre && visorUrl as url" class="adjunto__visor">
  <embed *ngIf="esPdf()" [src]="url" type="application/pdf" />
  <img *ngIf="esImagen()" [src]="url" [alt]="nombre" />
</div>
