<div class="foto">
  <img
    *ngIf="url() && !falloCarga(); else iniciales_"
    class="foto__img"
    [src]="url()"
    [alt]="'Foto de ' + nombre"
    (error)="falloCarga.set(true)"
  />
  <ng-template #iniciales_>
    <div class="foto__iniciales">{{ iniciales }}</div>
  </ng-template>

  <button
    *ngIf="puedeEditar"
    type="button"
    class="foto__editar"
    (click)="abrir()"
    [attr.aria-label]="fotoId ? 'Cambiar foto' : 'Cargar foto'"
    [title]="fotoId ? 'Cambiar foto' : 'Cargar foto'"
  >
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Z" />
    </svg>
  </button>
</div>

<div *ngIf="abierto()" class="modal" (click)="cerrar()">
  <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="foto-titulo" (click)="$event.stopPropagation()">
    <header class="modal__header">
      <div>
        <h3 id="foto-titulo">Foto del funcionario</h3>
        <p>JPG o PNG. Arrastrá la imagen para encuadrarla.</p>
      </div>
      <button type="button" class="modal__close" (click)="cerrar()" [disabled]="guardando()" aria-label="Cerrar">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </header>

    <div class="recorte">
      <div
        class="recorte__vista"
        [style.width.px]="ladoVista"
        [style.height.px]="ladoVista"
        [class.recorte__vista--movible]="vista()"
        (pointerdown)="vista() && empezarArrastre($event)"
        (pointermove)="arrastrar($event)"
        (pointerup)="soltar($event)"
        (pointercancel)="soltar($event)"
      >
        <img
          *ngIf="vista() as v; else actual"
          class="recorte__img"
          [src]="v.url"
          [ngStyle]="estilo(encuadre()!)"
          alt="Vista previa"
          draggable="false"
        />
        <ng-template #actual>
          <img *ngIf="url() && !falloCarga(); else inicialesGrandes" class="recorte__actual" [src]="url()" alt="Foto actual" />
          <ng-template #inicialesGrandes>
            <span class="recorte__iniciales">{{ iniciales }}</span>
          </ng-template>
        </ng-template>
      </div>

      <label *ngIf="encuadre() as e" class="recorte__zoom">
        <span>Zoom</span>
        <input
          type="range"
          min="1"
          [max]="zoomMaximo"
          step="0.01"
          [value]="e.zoom"
          (input)="cambiarZoom($event)"
          [disabled]="guardando()"
          aria-label="Zoom"
        />
      </label>

      <button type="button" class="btn btn--ghost btn--sm" (click)="selector.click()" [disabled]="guardando()">
        {{ vista() ? 'Elegir otra imagen' : 'Elegir imagen' }}
      </button>
      <input #selector type="file" class="recorte__file" accept=".jpg,.jpeg,.png,image/jpeg,image/png" (change)="elegir($event)" />
    </div>

    <div *ngIf="error()" class="modal__error" role="alert">{{ error() }}</div>

    <footer class="modal__actions">
      <button *ngIf="fotoId" type="button" class="btn btn--peligro" (click)="quitar()" [disabled]="guardando()">
        Quitar foto
      </button>
      <span class="modal__espacio"></span>
      <button type="button" class="btn btn--ghost" (click)="cerrar()" [disabled]="guardando()">Cancelar</button>
      <button type="button" class="btn btn--primary" (click)="guardar()" [disabled]="!vista() || guardando()">
        {{ guardando() ? 'Guardando...' : 'Guardar' }}
      </button>
    </footer>
  </div>
</div>
