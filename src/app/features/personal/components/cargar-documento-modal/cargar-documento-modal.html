<div class="modal" (click)="cerrar()" (dragover)="bloquearDrop($event)" (drop)="bloquearDrop($event)">
  <div
    class="modal__card"
    (click)="$event.stopPropagation()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <header class="modal__header">
      <div>
        <h3>Cargar documento</h3>
        <p>PDF, JPG o PNG, hasta 10 MB.</p>
      </div>
      <button type="button" class="modal__close" (click)="cerrar()" [disabled]="subiendo()" aria-label="Cerrar">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </header>

    <div *ngIf="etapa() === 'elegir'" class="carga__zona" [class.carga__zona--activa]="arrastrando()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
      </svg>
      <p>
        Arrastrá un archivo acá o
        <button type="button" class="carga__link" (click)="fileInput.click()">elegí uno</button>
      </p>
    </div>

    <ng-container *ngIf="archivo() as a">
      <div class="carga__ficha" [class.carga__ficha--activa]="arrastrando()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
        </svg>
        <div class="carga__datos">
          <span class="carga__nombre">{{ a.name }}</span>
          <span class="carga__meta">{{ tamanioArchivo() }}</span>
        </div>
        <button type="button" class="btn btn--ghost btn--sm" (click)="fileInput.click()" [disabled]="subiendo()">
          Cambiar archivo
        </button>
      </div>

      <label class="modal__field">
        <span>Descripción (opcional)</span>
        <input
          type="text"
          [value]="descripcion()"
          (input)="descripcion.set($any($event.target).value)"
          [maxLength]="descripcionMaxima"
          [disabled]="subiendo()"
          placeholder="ej: Cédula, frente y dorso"
          autocomplete="off"
        />
      </label>
    </ng-container>

    <input
      #fileInput
      type="file"
      class="carga__file"
      [accept]="extensionesPermitidas"
      (change)="onArchivoElegido($event)"
    />

    <div *ngIf="subiendo()" class="carga__progreso">
      <div
        class="carga__pista"
        role="progressbar"
        aria-label="Progreso de la subida"
        aria-valuemin="0"
        aria-valuemax="100"
        [attr.aria-valuenow]="progreso()"
      >
        <div
          class="carga__barra"
          [class.carga__barra--indeterminada]="progreso() === null"
          [style.width.%]="progreso() ?? 40"
        ></div>
      </div>
      <span>{{ textoProgreso() }}</span>
    </div>

    <div *ngIf="error()" class="modal__error" role="alert">
      {{ error() }}
      <ng-container *ngIf="ayudaConflicto() as ayuda"> {{ ayuda }}</ng-container>
    </div>

    <div *ngIf="conflictoActual() as c" class="carga__existente">
      <span class="carga__nombre">{{ titulo(c.existente) }}</span>
      <span class="carga__meta">{{ c.existente.nombre_original }} · {{ fechaHora(c.existente.subido_en) }}</span>
    </div>

    <footer class="modal__actions">
      <button type="button" class="btn btn--ghost" (click)="cerrar()" [disabled]="subiendo()">Cancelar</button>
      <button type="button" class="btn btn--primary" (click)="subir()" [disabled]="!archivo() || subiendo()">
        {{ subiendo() ? 'Subiendo...' : 'Subir' }}
      </button>
    </footer>
  </div>
</div>
