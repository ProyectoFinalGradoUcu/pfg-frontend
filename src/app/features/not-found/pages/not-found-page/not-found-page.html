<section class="not-found" [class.not-found--suelta]="!conSesion()">
  <div class="not-found__card">
    <div class="not-found__shield" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />
      </svg>
    </div>

    <p class="not-found__code">Error 404</p>
    <h1>Página no encontrada</h1>
    <p class="not-found__text">
      La dirección <code>{{ direccion }}</code> no corresponde a ninguna pantalla del sistema.
      Revise que esté bien escrita.
    </p>

    <a *ngIf="conSesion(); else irAlLogin" class="not-found__action" routerLink="/dashboard">Volver al inicio</a>
    <ng-template #irAlLogin>
      <a class="not-found__action" routerLink="/auth/login">Ir al inicio de sesión</a>
    </ng-template>
  </div>
</section>
