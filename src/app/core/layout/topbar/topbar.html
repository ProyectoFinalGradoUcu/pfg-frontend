<header class="topbar">
  <div class="topbar__brand">
    <span class="topbar__title">Sistema de Gestión de Personal</span>
    <small class="topbar__subtitle">Dirección de Personal - Fuerza Aérea Uruguaya</small>
  </div>

  <span *ngIf="unidadDeAlcance() as unidad" class="topbar__alcance" title="Solo ves los datos de esta unidad">
    Viendo: {{ unidad }}
  </span>

  <button *ngIf="user()" type="button" class="topbar__logout" (click)="signOut()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m-3 0-3-3m0 0 3-3m-3 3H15" />
    </svg>
    Cerrar Sesión
  </button>
</header>
