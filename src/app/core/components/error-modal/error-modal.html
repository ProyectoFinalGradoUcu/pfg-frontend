<ng-container *ngIf="state() as s">
  <div class="error-modal-backdrop" (click)="close()"></div>

  <div class="error-modal" role="alertdialog" aria-modal="true" [attr.aria-label]="s.title">
    <span class="error-modal__icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
      </svg>
    </span>

    <h2 class="error-modal__title">{{ s.title }}</h2>
    <p class="error-modal__message">{{ s.message }}</p>

    <button type="button" class="error-modal__btn" (click)="close()">Entendido</button>
  </div>
</ng-container>
