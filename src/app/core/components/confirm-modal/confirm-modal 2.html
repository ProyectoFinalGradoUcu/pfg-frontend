<ng-container *ngIf="state() as s">
  <div class="confirm-modal-backdrop" (click)="responder(false)"></div>

  <div class="confirm-modal" role="alertdialog" aria-modal="true" [attr.aria-label]="s.titulo">
    <span class="confirm-modal__icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
      </svg>
    </span>

    <h2 class="confirm-modal__title">{{ s.titulo }}</h2>
    <p class="confirm-modal__message">{{ s.mensaje }}</p>

    <div class="confirm-modal__actions">
      <button type="button" class="confirm-modal__btn confirm-modal__btn--ghost" (click)="responder(false)">
        {{ s.textoCancelar }}
      </button>
      <button type="button" class="confirm-modal__btn" (click)="responder(true)">
        {{ s.textoConfirmar }}
      </button>
    </div>
  </div>
</ng-container>
